[project]
name = "market-analyst"
version = "0.1.0"
description = "Analyste boursier / crypto multi-agents (LangChain + LangGraph)"
authors = [
    { name = "Yoann CORGNET" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "langchain>=1.4.9",
    "langchain-google-genai>=4.4.3",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "mcp[cli]>=2.3",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "trafilatura>=2.3.1",
    "yfinance>=1.8.0",
]

[project.scripts]
market-analyst = "market_analyst.main:main"
market-mcp = "market_mcp.server:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["market_analyst", "market_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
